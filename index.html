<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio – Sahda Rahani Susilawati</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green-dark:  #5a6e3f;
      --green-mid:   #6e7f4e;
      --green-card:  #b8c99a;
      --green-bg:    #d4e3b5;
      --green-tag:   #c8d9a8;
      --white:       #ffffff;
      --text-dark:   #3d4a2e;
      --text-muted:  #6b7a56;
      --nav-h: 68px;
    }

    html { scroll-behavior: smooth; }

    html, body {
      width: 100%;
      background: var(--green-bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text-dark);
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }

    /* ── NAVBAR ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: var(--green-dark);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2.5rem;
      height: var(--nav-h);
    }

    .nav-logo {
      display: flex; align-items: center;
      text-decoration: none;
    }
    .nav-logo .logo-icon {
      width: 46px; height: 46px;
      display: flex; align-items: center; justify-content: center;
    }
    .nav-logo .logo-icon img {
      width: 100%; height: 100%;
      object-fit: contain;
    }

    .nav-links {
      display: flex; gap: 1.7rem;
      list-style: none;
      flex-wrap: wrap;
    }
    .nav-links a {
      color: var(--white);
      text-decoration: none;
      font-size: .95rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: opacity .2s;
      padding-bottom: 4px;
      white-space: nowrap;
    }
    .nav-links a:hover { opacity: .7; }
    .nav-links a.active {
      border-bottom: 2px solid var(--white);
    }

    /* Open to Work — switch */
    .work-switch {
      display: flex; align-items: center; gap: 10px;
    }
    .work-switch .switch-track {
      position: relative;
      width: 42px; height: 22px;
      background: #dff0c4;
      border: 2px solid var(--white);
      border-radius: 999px;
      flex-shrink: 0;
    }
    .work-switch .switch-knob {
      position: absolute;
      top: 1px; right: 1px;
      width: 14px; height: 14px;
      background: var(--white);
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.25);
      animation: pulseKnob 2.4s ease-in-out infinite;
    }
    @keyframes pulseKnob {
      0%, 100% { box-shadow: 0 0 0 3px rgba(255,255,255,0.25); }
      50%      { box-shadow: 0 0 0 6px rgba(255,255,255,0.12); }
    }
    .work-switch .switch-label {
      color: var(--white);
      font-size: .95rem;
      font-weight: 500;
      white-space: nowrap;
    }

    /* ── HERO ── */
    .hero {
      min-height: 100vh;
      padding-top: 68px;
      background: var(--green-bg);
      position: relative;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* blobs */
    .blob-left {
      position: absolute;
      bottom: 0; left: 0;
      width: 280px;
      pointer-events: none;
    }
    .blob-right {
      position: absolute;
      bottom: 0; right: 0;
      width: 240px;
      pointer-events: none;
    }

    /* ── BIG "PORTFOLIO" TEXT ── */
    .portfolio-word {
      position: relative;
      width: 100%;
      max-width: 740px;
      height: 420px;
      display: flex; align-items: center; justify-content: center;
      margin-top: 1rem;
    }

    /* portfolio image */
    .portfolio-img {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      z-index: 1;
      pointer-events: none;
    }

    .avatar-wrap {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -42%);
      width: 210px; height: 310px;
      z-index: 10;
    }
    .avatar-wrap img {
      width: 100%; height: 100%;
      object-fit: contain;
      display: block;
    }

    /* ── NAME ── */
    .name-block {
      margin-top: .5rem;
      display: flex; flex-wrap: wrap; justify-content: center; gap: 0 1.5rem;
      animation: fadeUp .8s .3s both;
    }
    .name-part {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      color: var(--green-dark);
      line-height: 1.1;
    }

    /* ── SUBTITLE ── */
    .subtitle {
      margin-top: .6rem;
      font-size: 1rem;
      color: var(--text-muted);
      letter-spacing: .04em;
      font-weight: 500;
      animation: fadeUp .8s .5s both;
    }
    .subtitle span { margin: 0 .3em; }

    /* ── BUTTON ── */
    .btn-about {
      margin-top: 2.2rem;
      display: inline-block;
      background: transparent;
      border: 2px solid var(--green-dark);
      border-radius: 999px;
      padding: 14px 56px;
      font-size: 1.05rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      color: var(--green-dark);
      cursor: pointer;
      text-decoration: none;
      transition: background .25s, color .25s, transform .18s;
      animation: fadeUp .8s .65s both;
      margin-bottom: 3.5rem;
    }
    .btn-about:hover {
      background: var(--green-dark);
      color: var(--white);
      transform: scale(1.04);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <a class="nav-logo" href="index.html">
      <div class="logo-icon"><img src="assets/logo.png" alt="Logo"/></div>
    </a>

    <ul class="nav-links">
      <li><a href="about.html" class="active">About</a></li>
      <li><a href="education.html">Education</a></li>
      <li><a href="skil.html">Skills</a></li>
      <li><a href="experience.html">Experiences</a></li>
      <li><a href="organization.html">Organization</a></li>
      <li><a href="project.html">Project</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>

    <div class="work-switch" role="status" aria-label="Status: Open to Work, aktif">
      <div class="switch-track"><div class="switch-knob"></div></div>
      <span class="switch-label">Open To Work</span>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <img class="blob-left"  src="assets/blobs1.png" alt=""/>
    <img class="blob-right" src="assets/blobs2.png" alt=""/>

    <!-- Big scattered PORTFOLIO letters + avatar -->
    <div class="portfolio-word">
      <img class="portfolio-img" src="assets/portfolio.png" alt="Portfolio"/>
    </div>

    <!-- Name -->
    <div class="name-block">
      <span class="name-part">Sahda</span>
      <span class="name-part">Rahani</span>
      <span class="name-part">Susilawati</span>
    </div>

    <!-- Subtitle -->
    <p class="subtitle">
      — Computer Science Graduate | Aspiring Software Engineer | AI, Computer Vision & Mobile Development
    </p>

    <!-- CTA -->
    <a class="btn-about" href="about.html">About Me?</a>
  </section>

</body>
</html>
