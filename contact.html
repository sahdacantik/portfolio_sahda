<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />

  <title>Contact – Sahda Rahani Susilawati</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green-dark:  #5a6e3f;
      --green-mid:   #6e7f4e;
      --green-card:  #b8c99a;
      --green-bg:    #d4e3b5;
      --white:       #ffffff;
      --text-dark:   #3d4a2e;
      --text-muted:  #6b7a56;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: var(--green-bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text-dark);
    }

    /* ── NAVBAR ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: var(--green-dark);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2.5rem;
      height: 68px;
    }

    .nav-logo {
      display: flex; align-items: center;
      text-decoration: none;
    }
    .nav-logo .logo-icon {
      width: 46px; height: 46px;
      display: flex; align-items: center; justify-content: center;
    }
    .nav-logo .logo-icon img {
      width: 100%; height: 100%;
      object-fit: contain;
    }

    .nav-links {
      display: flex; gap: 3rem;
      list-style: none;
    }
    .nav-links a {
      color: var(--white);
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: opacity .2s;
      padding-bottom: 4px;
    }
    .nav-links a:hover { opacity: .7; }
    .nav-links a.active {
      border-bottom: 2px solid var(--white);
    }

    .nav-badge {
      display: flex; align-items: center; gap: 10px;
      border: 2px solid var(--white);
      border-radius: 999px;
      padding: 7px 20px;
      color: var(--white);
      font-size: .95rem;
      font-weight: 500;
      cursor: default;
    }
    .badge-dot {
      width: 14px; height: 14px;
      background: var(--white);
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── PAGE ── */
    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 100px 2rem 4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── PAGE TITLE ── */
    .page-title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2.8rem, 6vw, 5rem);
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 2rem;
      letter-spacing: -0.5px;
      animation: fadeUp .7s .1s both;
    }

    /* ── CONTACT CARD ── */
    .contact-card {
      width: 100%;
      max-width: 780px;
      border: 2px solid var(--green-mid);
      border-radius: 22px;
      padding: 2.4rem 3rem;
      margin-bottom: 2rem;
      animation: fadeUp .7s .2s both;
    }

    /* info table */
    .info-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2rem;
    }
    .info-table tr { vertical-align: middle; }
    .info-table td {
      padding: 10px 0;
      font-size: 1.1rem;
      color: var(--text-dark);
      font-weight: 500;
    }
    .info-table .label { width: 120px; }
    .info-table .colon { width: 30px; text-align: center; color: var(--text-muted); }
    .info-table .value { color: var(--text-dark); }
    .info-table .value a {
      color: var(--text-dark);
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: opacity .2s;
    }
    .info-table .value a:hover { opacity: .65; }

    /* social icons */
    .socials {
      display: flex;
      justify-content: center;
      gap: 1.4rem;
    }
    .socials a {
      display: flex; align-items: center; justify-content: center;
      width: 52px; height: 52px;
      color: var(--text-dark);
      transition: opacity .2s, transform .18s;
    }
    .socials a:hover {
      opacity: .65;
      transform: scale(1.12);
    }
    .socials svg {
      width: 42px; height: 42px;
    }

    /* ── CV BUTTON ── */
    .btn-cv {
      display: inline-block;
      background: var(--green-light, #d8e8be);
      border: 2px solid var(--green-mid);
      border-radius: 999px;
      padding: 14px 80px;
      font-size: 1.05rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      color: var(--text-dark);
      text-decoration: none;
      cursor: pointer;
      transition: background .22s, color .22s, transform .18s;
      animation: fadeUp .7s .35s both;
    }
    .btn-cv:hover {
      background: var(--green-dark);
      color: var(--white);
      transform: scale(1.04);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
