<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coming Soon – Sahda Rahani Susilawati</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green-dark:  #5a6e3f;
      --green-mid:   #6e7f4e;
      --green-card:  #b8c99a;
      --green-bg:    #d4e3b5;
      --green-tag:   #c8d9a8;
      --olive:       #b7ae63;
      --road:        #75875c;
      --white:       #ffffff;
      --text-dark:   #3d4a2e;
      --text-muted:  #6b7a56;
      --nav-h: 68px;
    }

    html { scroll-behavior: smooth; }
    html, body {
      width: 100%; height: 100%;
      background: var(--green-bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text-dark);
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }

    /* ── NAVBAR (sama seperti halaman lain) ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: var(--green-dark);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2.5rem;
      height: var(--nav-h);
    }
    .nav-logo { display: flex; align-items: center; text-decoration: none; }
    .nav-logo .logo-icon { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; }
    .nav-logo .logo-icon img { width: 100%; height: 100%; object-fit: contain; }
    .nav-links { display: flex; gap: 1.7rem; list-style: none; flex-wrap: wrap; }
    .nav-links a {
      color: var(--white); text-decoration: none; font-size: .95rem; font-weight: 500;
      letter-spacing: 0.01em; transition: opacity .2s; padding-bottom: 4px; white-space: nowrap;
    }
    .nav-links a:hover { opacity: .7; }
    .nav-links a.active { border-bottom: 2px solid var(--white); }

    .work-switch { display: flex; align-items: center; gap: 10px; }
    .work-switch .switch-track {
      position: relative; width: 42px; height: 22px; background: #dff0c4;
      border: 2px solid var(--white); border-radius: 999px; flex-shrink: 0;
    }
    .work-switch .switch-knob {
      position: absolute; top: 1px; right: 1px; width: 14px; height: 14px;
      background: var(--white); border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.25);
      animation: pulseKnob 2.4s ease-in-out infinite;
    }
    @keyframes pulseKnob {
      0%, 100% { box-shadow: 0 0 0 3px rgba(255,255,255,0.25); }
      50%      { box-shadow: 0 0 0 6px rgba(255,255,255,0.12); }
    }
    .work-switch .switch-label { color: var(--white); font-size: .95rem; font-weight: 500; white-space: nowrap; }

    /* ── COMING SOON PAGE ── */
    .coming-wrap {
      position: relative;
      min-height: 100vh;
      padding-top: var(--nav-h);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Dekorasi blob & garis lengkung di background */
    .blob {
      position: absolute;
      border-radius: 50%;
      background: var(--green-card);
      opacity: .55;
      z-index: 0;
    }
    .blob.b1 { width: 380px; height: 380px; top: -160px; right: -140px; }
    .blob.b2 { width: 300px; height: 300px; bottom: -140px; left: -110px; }
    .dot-circle {
      position: absolute; bottom: 90px; right: 110px;
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--olive); opacity: .5; z-index: 0;
    }
    .curve-line { position: absolute; opacity: .35; color: var(--text-dark); z-index: 0; }
    .curve-line.c1 { bottom: 0; left: 0; width: 260px; height: 220px; }
    .curve-line.c2 { bottom: 0; right: 0; width: 300px; height: 200px; }

    .star {
      position: absolute; color: var(--green-dark); z-index: 0;
    }
    .star.outline { top: 130px; left: 6%; width: 32px; height: 32px; opacity: .75; }
    .star.filled { top: 190px; right: 8%; width: 20px; height: 20px; opacity: .8; }

    /* Back link */
    .back-link {
      position: relative; z-index: 3;
      display: inline-flex; align-items: center; gap: .45rem;
      font-size: .85rem; font-weight: 600; color: var(--text-dark);
      text-decoration: none;
      margin: 1.6rem 0 0 2rem;
      transition: gap .18s ease;
    }
    .back-link:hover { gap: .65rem; }
    .back-link svg { width: 16px; height: 16px; }

    /* Center content */
    .center-content {
      position: relative; z-index: 2;
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
      gap: 1.1rem;
      padding: 2rem 1.5rem 4rem;
    }

    .sprout-icon { width: 66px; height: 66px; color: var(--green-dark); }

    .coming-title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2rem, 6vw, 2.9rem);
      color: var(--text-dark);
    }

    .coming-desc { font-size: .95rem; line-height: 1.75; color: var(--text-muted); max-width: 42ch; }

    .back-pill-btn {
      margin-top: .6rem;
      display: inline-flex; align-items: center; gap: .55rem;
      border: 1.6px solid var(--text-dark);
      border-radius: 999px;
      padding: .75rem 1.7rem;
      text-decoration: none; color: var(--text-dark);
      font-weight: 600; font-size: .9rem;
      transition: background .18s ease, color .18s ease, transform .18s ease;
    }
    .back-pill-btn:hover {
      background: var(--green-dark); color: var(--white); border-color: var(--green-dark);
      transform: translateY(-2px);
    }
    .back-pill-btn svg { width: 15px; height: 15px; }

    .reveal { opacity: 0; transform: translateY(20px); transition: opacity .7s ease, transform .7s ease; }
    .reveal.in-view { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <a class="nav-logo" href="index.html">
      <div class="logo-icon"><img src="assets/logo.png" alt="Logo"/></div>
    </a>
    <ul class="nav-links">
      <li><a href="about.html">About</a></li>
      <li><a href="education.html">Education</a></li>
      <li><a href="skil.html">Skills</a></li>
      <li><a href="experience.html">Experiences</a></li>
      <li><a href="organization.html">Organization</a></li>
      <li><a href="project.html" class="active">Project</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="work-switch" role="status" aria-label="Status: Open to Work, aktif">
      <div class="switch-track"><div class="switch-knob"></div></div>
      <span class="switch-label">Open To Work</span>
    </div>
  </nav>

  <div class="coming-wrap">

    <!-- Dekorasi -->
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="dot-circle"></div>

    <svg class="curve-line c1" viewBox="0 0 260 220" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 220C60 200 90 140 70 90C50 40 10 20 0 0" stroke="currentColor" stroke-width="1.4"/>
    </svg>
    <svg class="curve-line c2" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M300 200C230 190 190 140 210 90C230 40 280 20 300 0" stroke="currentColor" stroke-width="1.4"/>
    </svg>

    <svg class="star outline" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2v6M12 16v6M2 12h6M16 12h6M5 5l4 4M15 15l4 4M19 5l-4 4M9 15l-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <svg class="star filled" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"/>
    </svg>

    <!-- Back link -->
    <a class="back-link" href="project.html">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Projects
    </a>

    <!-- Center content -->
    <div class="center-content reveal">
      <svg class="sprout-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 4v3M12 21V11M17.5 6.5l-2 2M6.5 6.5l2 2M20 10l-2.5.7M4 10l2.5.7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M12 11c0-3 2.5-4.5 5-4.5-.2 3-2.2 4.8-5 4.8z" fill="currentColor"/>
        <path d="M12 11.3c0-2.6-2.1-3.9-4.3-3.9.2 2.6 1.9 4.1 4.3 4.1z" fill="currentColor"/>
      </svg>

      <h1 class="coming-title">Coming Soon</h1>
      <p class="coming-desc">
        This section is currently under development.<br/>
        I'm working hard to bring you more projects soon!<br/>
        Thank you for your patience. ♡
      </p>

      <a class="back-pill-btn" href="project.html">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back to Projects
      </a>
    </div>

  </div>

  <script>
    (function () {
      const revealEls = document.querySelectorAll('.reveal');
      const io = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('in-view');
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });
      revealEls.forEach((el) => io.observe(el));
    })();
  </script>

</body>
</html>
